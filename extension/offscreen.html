<!doctype html>
<!-- Offscreen document: the ONLY place a Manifest V3 extension is allowed to
     touch a live MediaStream / Web Audio. It has no UI, is never shown; the
     background creates it when you start listening and tears it down when you
     stop. All it does is capture the Discord tab's audio and stream it to
     Deepgram for transcription. -->
<html>
  <head><meta charset="utf-8"></head>
  <body><script src="offscreen.js"></script></body>
</html>
